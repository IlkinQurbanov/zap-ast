<body>
<div data-component="header"></div>
<main id="main" data-page="catalog" tabindex="-1">
<div class="container">
  <div class="page-head">
    <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="index.html">Ana səhifə</a></li><li><a href="catalog.html">Kataloq</a></li><li><span aria-current="page" data-crumb-current>Kataloq</span></li></ol></nav>
    <div class="page-head__title"><h1 data-cat-title>Kataloq</h1><span class="page-head__count" data-cat-count aria-live="polite"></span></div>
  </div>
  <div class="cat-tabs" data-cat-tabs role="group" aria-label="Kateqoriyalar"></div>
  <div class="catalog-layout">
    <aside class="filters" id="filters" aria-label="Filtrlər">
      <div class="filters__head">
        <h2>Filtrlər</h2>
        <button type="button" class="btn btn--ghost btn--sm" data-clear>Təmizlə</button>
        <button type="button" class="icon-btn filters__close" data-close-filters aria-label="Filtrləri bağla"><span data-icon="close" data-size="22"></span></button>
      </div>
      <div class="filters__scroll" data-filter-body></div>
      <div class="filters__foot">
        <button type="button" class="btn btn--outline" data-clear>Təmizlə</button>
        <button type="button" class="btn btn--primary" data-close-filters data-apply-count>Nəticələri göstər</button>
      </div>
    </aside>
    <div class="filters-overlay" data-filters-overlay hidden></div>
    <div class="catalog-main">
      <div class="toolbar">
        <button type="button" class="btn btn--outline toolbar__filter-btn" data-open-filters aria-controls="filters" aria-expanded="false"><span data-icon="filter" data-size="18"></span>Filtrlər</button>
        <div class="toolbar__chips chip-row" data-active-chips aria-label="Aktiv filtrlər"></div>
        <div class="toolbar__sort"><label for="sort">Sırala:</label><select class="select" id="sort"></select></div>
      </div>
      <div class="product-grid product-grid--3" data-catalog-grid></div>
      <div class="empty" data-catalog-empty hidden>
        <span class="empty__icon"><span data-icon="search" data-size="28"></span></span>
        <h2>Uyğun məhsul tapılmadı</h2>
        <p>Filtrləri azaldın.</p>
        <div class="cluster"><button type="button" class="btn btn--primary" data-clear>Filtrləri təmizlə</button><a class="btn btn--outline" href="index.html">Ölçüyə görə axtar</a></div>
      </div>
      <div class="load-more" data-load-more hidden>
        <span class="load-more__meta" data-more-meta></span>
        <span class="load-more__bar" aria-hidden="true"><span data-more-bar></span></span>
        <button type="button" class="btn btn--outline btn--lg">Daha çox göstər</button>
      </div>
    </div>
  </div>
</div>
</main>
